[project]
name = "fitness-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2wsgi>=1.10.0",
    "asgiref>=3.8",
    "django>=5.1",
    "dj-database-url>=2.1",
    "fastapi>=0.121.3",
    "httpx>=0.28.1",
    "jq>=1.10.0",
    "openai>=2.8.1",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "supabase>=2.24.0",
    "uvicorn>=0.38.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-django>=4.5.0",
]
dev = [
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "src.core.test_settings"
