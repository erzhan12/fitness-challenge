name: Deploy to DigitalOcean

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        
      - name: Set up Python
        run: uv python install
        
      - name: Install dependencies with test extras
        run: uv sync --extra test
        
      - name: Run tests
        env:
          # Dummy values for testing - actual values not needed for unit tests
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_SECRET_TOKEN: test_secret_token
          LLM_API_KEY: test_llm_key
          LLM_BASE_URL: https://api.test.com/v1
          LLM_MODEL: test-model
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_KEY: test_supabase_key
          ADMIN_API_KEY: test_admin_key
        run: uv run pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            DEPLOY_PATH=${DEPLOY_PATH:-/home/deploy/fitness-challenge}
            mkdir -p $DEPLOY_PATH
            mkdir -p $DEPLOY_PATH/deployment
            echo "Deployment directory created at: $DEPLOY_PATH"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Copy deployment files to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_PATH=${DEPLOY_PATH:-/home/deploy/fitness-challenge}
            mkdir -p "$DEPLOY_PATH/deployment"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Upload deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deployment/*"
          target: "${{ secrets.DEPLOY_PATH }}/deployment"

      - name: Create .env file on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,TELEGRAM_BOT_TOKEN,TELEGRAM_SECRET_TOKEN,LLM_API_KEY,LLM_BASE_URL,LLM_MODEL,SUPABASE_URL,SUPABASE_KEY,ADMIN_API_KEY,TARGET_CHAT_ID,TZ,DJANGO_SECRET_KEY,ALLOWED_HOSTS
          script: |
            set -euo pipefail
            DEPLOY_PATH=${DEPLOY_PATH:-/home/deploy/fitness-challenge}

            cat > "$DEPLOY_PATH/.env" << EOF
            # Docker image
            DOCKER_REGISTRY=${{ env.REGISTRY }}
            DOCKER_IMAGE_NAME=${{ env.IMAGE_NAME }}
            IMAGE_TAG=latest

            # Postgres
            POSTGRES_DB=$POSTGRES_DB
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB

            # App env
            TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
            TELEGRAM_SECRET_TOKEN=$TELEGRAM_SECRET_TOKEN
            LLM_API_KEY=$LLM_API_KEY
            LLM_BASE_URL=$LLM_BASE_URL
            LLM_MODEL=$LLM_MODEL
            SUPABASE_URL=$SUPABASE_URL
            SUPABASE_KEY=$SUPABASE_KEY
            ADMIN_API_KEY=$ADMIN_API_KEY
            TARGET_CHAT_ID=$TARGET_CHAT_ID
            TZ=$TZ

            # Django settings
            DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY
            ALLOWED_HOSTS=$ALLOWED_HOSTS
            EOF
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SECRET_TOKEN: ${{ secrets.TELEGRAM_SECRET_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          TZ: "Asia/Almaty"
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH,GITHUB_TOKEN
          script: |
            set -euo pipefail
            DEPLOY_PATH=${DEPLOY_PATH:-/home/deploy/fitness-challenge}
            cd "$DEPLOY_PATH"

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose --env-file .env -f deployment/docker/docker-compose.yml pull web
            docker compose --env-file .env -f deployment/docker/docker-compose.yml down --timeout 30
            docker compose --env-file .env -f deployment/docker/docker-compose.yml up -d

            docker image prune -f
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            DEPLOY_PATH=${DEPLOY_PATH:-/home/deploy/fitness-challenge}
            
            cd "$DEPLOY_PATH"

            echo "Container Status:"
            docker compose --env-file .env -f deployment/docker/docker-compose.yml ps

            echo "Recent logs (web):"
            docker compose --env-file .env -f deployment/docker/docker-compose.yml logs --tail=50 web
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

  health-check:
    name: Health Check (HTTPS)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Check HTTPS endpoint
        run: |
          echo "Testing HTTPS endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://fitnesschallenge.habitreward.org/ || echo "000")
          
          if [ "$STATUS" == "200" ] || [ "$STATUS" == "404" ] || [ "$STATUS" == "405" ]; then
            echo "✅ HTTPS is working! (HTTP $STATUS)"
          else
            echo "⚠️ Warning: Unexpected HTTP status: $STATUS"
            echo "This might be normal on first deployment (SSL cert provisioning)"
            # Don't fail the workflow - Caddy might still be provisioning cert
          fi

      - name: Check SSL certificate
        run: |
          echo "Checking SSL certificate..."
          echo | openssl s_client -servername fitnesschallenge.habitreward.org -connect fitnesschallenge.habitreward.org:443 2>/dev/null | \
            openssl x509 -noout -dates || echo "SSL cert not ready yet (will be provisioned automatically)"

  set-webhook:
    name: Set Telegram Webhook
    runs-on: ubuntu-latest
    needs: health-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check current webhook and set if needed
        run: |
          WEBHOOK_URL="https://fitnesschallenge.habitreward.org/telegram/webhook"
          
          echo "Checking current webhook status..."
          CURRENT_WEBHOOK=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getWebhookInfo")
          echo "Current webhook info: $CURRENT_WEBHOOK"
          
          # Check if webhook is already set correctly
          if echo "$CURRENT_WEBHOOK" | grep -q "\"url\":\"$WEBHOOK_URL\""; then
            echo "✅ Webhook is already set correctly, skipping update"
          else
            echo "Setting Telegram webhook to: $WEBHOOK_URL"
            
            RESPONSE=$(curl -s -X POST \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
              -H "Content-Type: application/json" \
              -d "{
                \"url\": \"$WEBHOOK_URL\",
                \"secret_token\": \"${{ secrets.TELEGRAM_SECRET_TOKEN }}\",
                \"drop_pending_updates\": true
              }")
            
            echo "Webhook API Response: $RESPONSE"
            
            # Check if webhook was set successfully
            if echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "✅ Webhook set successfully!"
            else
              echo "⚠️ Warning: Webhook might not have been set correctly"
              echo "Response: $RESPONSE"
              # Don't fail the workflow - webhook can be set manually if needed
            fi
          fi
