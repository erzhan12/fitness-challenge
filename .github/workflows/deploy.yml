name: Deploy to DigitalOcean

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies with test extras
        run: uv sync --extra test

      - name: Run tests
        env:
          # Dummy values for testing - actual values not needed for unit tests
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_SECRET_TOKEN: test_secret_token
          LLM_API_KEY: test_llm_key
          LLM_BASE_URL: https://api.test.com/v1
          LLM_MODEL: test-model
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_KEY: test_supabase_key
          ADMIN_API_KEY: test_admin_key
        run: uv run pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: production

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: |
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$DEPLOY_PATH" ]; then
            DEPLOY_PATH="/home/deploy/fitness-challenge"
          fi
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << SETUP
            DEPLOY_PATH="$DEPLOY_PATH"
            mkdir -p \$DEPLOY_PATH
            mkdir -p \$DEPLOY_PATH/logs
            mkdir -p \$DEPLOY_PATH/data
            # Ensure data directory is writable by container's non-root user
            chmod 777 \$DEPLOY_PATH/data
            echo "Deployment directory created at: \$DEPLOY_PATH"
          SETUP

      - name: Deploy to DigitalOcean Droplet
        run: |
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$DEPLOY_PATH" ]; then
            DEPLOY_PATH="/home/deploy/fitness-challenge"
          fi
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << DEPLOY
            DEPLOY_PATH="$DEPLOY_PATH"
            cd $DEPLOY_PATH || exit 1

            # Log in to GHCR on the server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Stop and remove existing container
            docker stop fitness-challenge || true
            docker rm fitness-challenge || true

            # Run new container
            docker run -d \
              --name fitness-challenge \
              --restart unless-stopped \
              -p 8001:8001 \
              -v \$DEPLOY_PATH/data:/app/data \
              -e DATABASE_URL="sqlite:////app/data/db.sqlite3" \
              -e DJANGO_SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
              -e ALLOWED_HOSTS="${{ secrets.ALLOWED_HOSTS }}" \
              -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              -e TELEGRAM_SECRET_TOKEN="${{ secrets.TELEGRAM_SECRET_TOKEN }}" \
              -e LLM_API_KEY="${{ secrets.LLM_API_KEY }}" \
              -e LLM_BASE_URL="${{ secrets.LLM_BASE_URL }}" \
              -e LLM_MODEL="${{ secrets.LLM_MODEL }}" \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
              -e ADMIN_API_KEY="${{ secrets.ADMIN_API_KEY }}" \
              -e TARGET_CHAT_ID="${{ secrets.TARGET_CHAT_ID }}" \
              -e TZ="Asia/Almaty" \
              ghcr.io/${{ github.repository }}:latest

            # Wait for container to start
            echo "Waiting for container to start..."
            sleep 5

            # Show container status
            echo "Container Status:"
            docker ps | grep fitness-challenge || echo "Container not found!"

            # Prune old images to save space
            docker image prune -f
          DEPLOY

      - name: Verify deployment
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'VERIFY'
            echo "Checking container logs:"
            docker logs fitness-challenge --tail=30 || echo "Container logs not available"

            echo "Checking container status:"
            docker ps -a | grep fitness-challenge || echo "Container not found"

            echo "Checking if container is healthy:"
            if docker ps | grep -q fitness-challenge; then
              echo "Container is running"
              # Check if port is listening
              if docker port fitness-challenge | grep -q 8001; then
                echo "Port 8001 is mapped correctly"
              else
                echo "Port 8001 mapping issue"
              fi
            else
              echo "Container is not running"
              exit 1
            fi
          VERIFY

  health-check:
    name: Health Check (HTTPS)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Check HTTPS endpoint
        run: |
          echo "Testing HTTPS endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://fitnesschallenge.habitreward.org/ || echo "000")

          if [ "$STATUS" == "200" ] || [ "$STATUS" == "404" ] || [ "$STATUS" == "405" ]; then
            echo "HTTPS is working! (HTTP $STATUS)"
          else
            echo "Warning: Unexpected HTTP status: $STATUS"
            echo "This might be normal on first deployment (SSL cert provisioning)"
            # Don't fail the workflow - Caddy might still be provisioning cert
          fi

      - name: Check SSL certificate
        run: |
          echo "Checking SSL certificate..."
          echo | openssl s_client -servername fitnesschallenge.habitreward.org -connect fitnesschallenge.habitreward.org:443 2>/dev/null | \
            openssl x509 -noout -dates || echo "SSL cert not ready yet (will be provisioned automatically)"

  set-webhook:
    name: Set Telegram Webhook
    runs-on: ubuntu-latest
    needs: health-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check current webhook and set if needed
        run: |
          WEBHOOK_URL="https://fitnesschallenge.habitreward.org/telegram/webhook"

          echo "Checking current webhook status..."
          CURRENT_WEBHOOK=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getWebhookInfo")
          echo "Current webhook info: $CURRENT_WEBHOOK"

          # Check if webhook is already set correctly
          if echo "$CURRENT_WEBHOOK" | grep -q "\"url\":\"$WEBHOOK_URL\""; then
            echo "Webhook is already set correctly, skipping update"
          else
            echo "Setting Telegram webhook to: $WEBHOOK_URL"

            RESPONSE=$(curl -s -X POST \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
              -H "Content-Type: application/json" \
              -d "{
                \"url\": \"$WEBHOOK_URL\",
                \"secret_token\": \"${{ secrets.TELEGRAM_SECRET_TOKEN }}\",
                \"drop_pending_updates\": true
              }")

            echo "Webhook API Response: $RESPONSE"

            # Check if webhook was set successfully
            if echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "Webhook set successfully!"
            else
              echo "Warning: Webhook might not have been set correctly"
              echo "Response: $RESPONSE"
              # Don't fail the workflow - webhook can be set manually if needed
            fi
          fi
