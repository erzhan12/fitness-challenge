version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: fitness_challenge_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fitness_challenge_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_NAME:-erzhan12/fitness-challenge}:${IMAGE_TAG:-latest}
    container_name: fitness_challenge_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_SECRET_TOKEN: ${TELEGRAM_SECRET_TOKEN}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      TARGET_CHAT_ID: ${TARGET_CHAT_ID:-}
      TZ: ${TZ:-Asia/Almaty}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      # For host-level Caddy: keep the app only on localhost (proxy to 127.0.0.1:8001)
      - "127.0.0.1:8001:8001"
    networks:
      - fitness_challenge_network

volumes:
  postgres_data:
    driver: local

networks:
  fitness_challenge_network:
    driver: bridge
